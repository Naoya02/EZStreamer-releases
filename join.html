<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EZStreamer 招待</title>
<style>
  :root { --bg: #f2f3f5; --card: #ffffff; --text: #1e1f22; --muted: #5c5e66; --accent: #5865f2; --accent-text: #ffffff; --border: #dcdde1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1f22; --card: #2b2d31; --text: #f2f3f5; --muted: #b5bac1; --accent: #5865f2; --accent-text: #ffffff; --border: #3f4147; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif; }
  .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 8px 0; }
  .room { color: var(--text); font-weight: 600; word-break: break-all; }
  .btn { display: inline-block; margin-top: 16px; padding: 10px 20px; border-radius: 6px; background: var(--accent); color: var(--accent-text);
         text-decoration: none; font-weight: 600; font-size: 15px; }
  .sub { display: block; margin-top: 18px; font-size: 13px; color: var(--muted); }
  .sub a { color: var(--accent); }
  .error { color: #f23f43; }
</style>
</head>
<body>
<main class="card" id="card">
  <h1>EZStreamer に招待されています</h1>
  <p id="who"></p>
  <a class="btn" id="open" href="#">EZStreamer を開く</a>
  <p>ボタンを押すと EZStreamer が起動し、参加の確認が表示されます。<br>起動には 30 秒ほどかかることがあります。</p>
  <span class="sub">
    まだ EZStreamer を入れていない人は
    <a href="https://github.com/Naoya02/EZStreamer-releases/releases/latest/download/EZStreamer.exe">こちらからダウンロード</a>
    し、一度起動してからもう一度このページを開いてください。
  </span>
</main>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var s = q.get("s") || "", r = (q.get("r") || "").slice(0, 64), h = (q.get("h") || "").slice(0, 64);
    var who = document.getElementById("who");
    var open = document.getElementById("open");
    if (!/^[0-9A-Za-z.-]{1,253}:\d{1,5}$/.test(s) || !r) {
      who.className = "error";
      who.textContent = "招待リンクが正しくありません。招待した人にもう一度リンクを送ってもらってください。";
      open.style.display = "none";
      return;
    }
    // textContent only: never interpret the query as HTML
    who.textContent = (h ? h + " さんから、" : "") + "ルーム「" + r + "」への招待です。";
    var link = "ezstreamer://join?" + new URLSearchParams({ s: s, r: r, h: h }).toString();
    open.href = link;
    // Try once automatically; the browser asks for permission the first time.
    setTimeout(function () { location.href = link; }, 300);
  })();
</script>
</body>
</html>
